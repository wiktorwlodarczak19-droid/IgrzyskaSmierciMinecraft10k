name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Wgraj plik jar jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: IgrzyskaSmierciMinecraft10k
          path: target/IgrzyskaSmierciMinecraft10k-*.jar

      - name: Release (tylko dla tagów v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/IgrzyskaSmierciMinecraft10k-*.jar
